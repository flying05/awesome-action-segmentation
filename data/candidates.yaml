- id: 2026-cvpr-hierarchical-learning-weakly-supervised
  title: Hierarchical Action Learning for Weakly-Supervised Action Segmentation
  authors:
  - Junxian Huang
  - Ruichu Cai
  - Juntao Fang
  - Hao Zhu
  - Boyan Xu
  - Weilin Chen
  - Zijian Li
  - Shenghua Gao
  year: 2026
  venue: CVPR
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/CVPR2026/html/Huang_Hierarchical_Action_Learning_for_Weakly-Supervised_Action_Segmentation_CVPR_2026_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/CVPR2026/papers/Huang_Hierarchical_Action_Learning_for_Weakly-Supervised_Action_Segmentation_CVPR_2026_paper.pdf
  arxiv_url: https://arxiv.org/abs/2602.24275
  doi: ''
  code_url: ''
  project_url: ''
  abstract: Humans perceive actions through key transitions that structure actions across multiple abstraction levels, whereas
    machines, relying on visual features, tend to over-segment. This highlights the difficulty of enabling hierarchical reasoning
    in video understanding. Interestingly, we observe that lower-level visual and high-level action latent variables evolve
    at different rates, with low-level visual variables changing rapidly, while high-level action variables evolve more slowly,
    making them easier to identify. Building on this insight, we propose the Hierarchical Action Learning (HAL) model for
    weakly-supervised action segmentation. Our approach introduces a hierarchical causal data generation process, where high-level
    latent action govern the dynamics of low-level visual features. To model these varying timescales effectively, we introduce
    deterministic processes to align these latent variables over time. The HAL model employs a hierarchical pyramid transformer
    to capture both visual features and latent variables, and a sparse transition constraint is applied to enforce the slower
    dynamics of high-level action variables. This mechanism enhances the identification of these latent variables over time.
    Under mild assumptions, we prove that these latent action variables are strictly identifiable. Experimental results on
    several benchmarks show that the HAL model significantly outperforms existing methods for weakly-supervised action segmentation,
    confirming its practical effectiveness in real-world applications.
