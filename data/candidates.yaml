- id: 2014-cvpr-language-actions-recovering-syntax-semantics
  title: 'The Language of Actions: Recovering the Syntax and Semantics of Goal-Directed Human Activities'
  authors:
  - Hilde Kuehne
  - Ali Arslan
  - Thomas Serre
  year: 2014
  venue: CVPR
  venue_tier: Related-but-not-core
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content_cvpr_2014/html/Kuehne_The_Language_of_2014_CVPR_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content_cvpr_2014/papers/Kuehne_The_Language_of_2014_CVPR_paper.pdf
  arxiv_url: ''
  doi: ''
  code_url: ''
  project_url: ''
  abstract: 'This paper describes a framework for modeling human activities as temporally structured processes. Our approach
    is motivated by the inherently hierarchical nature of human activities and the close correspondence between human actions
    and speech: We model action units using Hidden Markov Models, much like words in speech. These action units then form
    the building blocks to model complex human activities as sentences using an action grammar.    To evaluate our approach,
    we collected a large dataset of daily cooking activities: The dataset includes a total of 52 participants, each performing
    a total of 10 cooking activities in multiple real-life kitchens, resulting in over 77 hours of video footage. We evaluate
    the HTK toolkit, a state-of-the-art speech recognition engine, in combination with multiple video feature descriptors,
    for both the recognition of cooking activities (e.g., making pancakes) as well as the semantic parsing of videos into
    action units (e.g., cracking eggs). Our results demonstrate the benefits of structured temporal generative approaches
    over existing discriminative approaches in coping with the complexity of human daily life activities.'
