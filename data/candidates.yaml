- id: 2022-cvpr-unsupervised-by-joint-representation-learning
  title: Unsupervised Action Segmentation by Joint Representation Learning and Online Clustering
  authors:
  - Sateesh Kumar
  - Sanjay Haresh
  - Awais Ahmed
  - Andrey Konin
  - M. Zeeshan Zia
  - Quoc-Huy Tran
  year: 2022
  venue: CVPR
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/CVPR2022/html/Kumar_Unsupervised_Action_Segmentation_by_Joint_Representation_Learning_and_Online_Clustering_CVPR_2022_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/CVPR2022/papers/Kumar_Unsupervised_Action_Segmentation_by_Joint_Representation_Learning_and_Online_Clustering_CVPR_2022_paper.pdf
  arxiv_url: http://arxiv.org/abs/2105.13353
  doi: ''
  code_url: ''
  project_url: ''
  abstract: We present a novel approach for unsupervised activity segmentation which uses video frame clustering as a pretext
    task and simultaneously performs representation learning and online clustering. This is in contrast with prior works where
    representation learning and clustering are often performed sequentially. We leverage temporal information in videos by
    employing temporal optimal transport. In particular, we incorporate a temporal regularization term which preserves the
    temporal order of the activity into the standard optimal transport module for computing pseudo-label cluster assignments.
    The temporal optimal transport module enables our approach to learn effective representations for unsupervised activity
    segmentation. Furthermore, previous methods require storing learned features for the entire dataset before clustering
    them in an offline manner, whereas our approach processes one mini-batch at a time in an online manner. Extensive evaluations
    on three public datasets, i.e. 50-Salads, YouTube Instructions, and Breakfast, and our dataset, i.e., Desktop Assembly,
    show that our approach performs on par with or better than previous methods, despite having significantly less memory
    constraints.
