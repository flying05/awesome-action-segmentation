- id: 2023-preprint-dir-as-decoupling-individual-identification
  title: 'DIR-AS: Decoupling Individual Identification and Temporal Reasoning for Action Segmentation'
  authors:
  - Peiyao Wang
  - Haibin Ling
  year: 2023
  venue: Preprint
  venue_tier: Preprint
  publication_type: preprint
  official_publication_url: ''
