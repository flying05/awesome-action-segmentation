- id: 2026-cvpr-workshop-combining-boundary-supervision-segment-level
  title: Combining Boundary Supervision and Segment-Level Regularization for Fine-Grained Action Segmentation
  authors:
  - Hinako Mitsuoka
  - Kazuhiro Hotta
  year: 2026
  venue: CVPR Workshop
  venue_tier: Extended-Vision
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/CVPR2026W/SAUAFG/html/Mitsuoka_Combining_Boundary_Supervision_and_Segment-Level_Regularization_for_Fine-Grained_Action_Segmentation_CVPRW_2026_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/CVPR2026W/SAUAFG/papers/Mitsuoka_Combining_Boundary_Supervision_and_Segment-Level_Regularization_for_Fine-Grained_Action_Segmentation_CVPRW_2026_paper.pdf
  arxiv_url: https://arxiv.org/abs/2604.01859
  doi: ''
  code_url: ''
  project_url: ''
  abstract: Recent progress in Temporal Action Segmentation (TAS) has increasingly relied on complex architectures, which
    can hinder practical deployment. We present a lightweight dual-loss training framework that improves fine-grained segmentation
    quality with only one additional output channel and two auxiliary loss terms, requiring minimal architectural modification.
    Our approach combines a boundary-regression loss that promotes accurate temporal localization via a single-channel boundary
    prediction and a CDF-based segment-level regularization loss that encourages coherent within-segment structure by matching
    cumulative distributions over predicted and ground-truth segments. The framework is architecture-agnostic and can be integrated
    into existing TAS models (e.g., MS-TCN, C2F-TCN, FACT) as a training-time loss function. Across three benchmark datasets,
    the proposed method improves segment-level consistency and boundary quality, yielding higher F1 and Edit scores across
    three different models. Frame-wise accuracy remains largely unchanged, highlighting that precise segmentation can be achieved
    through simple loss design rather than heavier architectures or inference-time refinements.
