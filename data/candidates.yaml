- id: 2026-preprint-ego-metas-egocentric-online-multimodal
  title: 'Ego-METAS: Egocentric online Multimodal Energy-efficient Temporal Action Segmentation benchmark'
  authors:
  - Maria Santos-Villafranca
  - Jesus Bermudez-cameo
  - Alejandro Perez-Yus
  - Giovanni Maria Farinella
  - Antonino Furnari
  year: 2026
  venue: Preprint
  venue_tier: Preprint
  publication_type: preprint
  official_publication_url: ''
  official_pdf_url: https://arxiv.org/pdf/2606.02246
  arxiv_url: https://arxiv.org/abs/2606.02246
  doi: ''
  code_url: ''
  project_url: ''
  abstract: 'To operate in the physical world, embodied agents must perceive their environment in an "always-on" fashion,
    selectively accessing the most informative sensors to balance energy constraints and task accuracy. Despite its importance
    for resource-constrained devices, energy-aware perception remains under-explored, with most prior work assuming unlimited
    compute. To address this, we introduce Ego-METAS: the first Egocentric online Multimodal Energy-efficient Temporal Action
    Segmentation benchmark. Ego-METAS provides a unified testbed of more than 100 hours of untrimmed egocentric video from
    EgoExo4D, CMU-MMAC, and CaptainCook4D, spanning 5 modalities (RGB, audio, gaze, IMU, and monochrome camera). We formulate
    an online temporal action segmentation task where models must dynamically select which sensors to activate at each timestep
    while strictly adhering to hardware-representative energy budgets. Alongside the benchmark, we release unified splits,
    cleaned annotations, pre-extracted features, and a diverse suite of baseline routing policies. Our evaluations show that
    optimal routing is highly scenario-dependent, and that existing policy-learning methods, designed primarily for trimmed
    clips, struggle to adapt to continuous, untrimmed environments. However, even simple dynamic fusion of complementary modalities
    (e.g., via random routing) proves critical for balancing predictive accuracy against strict energy budgets. Ultimately,
    Ego-METAS provides a standardized foundation to develop robust, cost-aware policies for autonomous, always-on embodied
    AI.'
