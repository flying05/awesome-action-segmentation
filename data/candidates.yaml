- id: 2023-ego4d-epic-workshop-enhancing-transformer-backbone-egocentric
  title: Enhancing Transformer Backbone for Egocentric Video Action Segmentation
  authors:
  - Sakib Reza
  - Balaji Sundareshan
  - Mohsen Moghaddam
  - Octavia Camps
  year: 2023
  venue: Ego4D/EPIC Workshop
