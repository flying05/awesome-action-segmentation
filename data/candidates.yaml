- id: 2023-iccv-lac-latent-composition-skeleton-based
  title: LAC - Latent Action Composition for Skeleton-based Action Segmentation
  authors:
  - Di Yang
  - Yaohui Wang
  - Antitza Dantcheva
  - Quan Kong
  - Lorenzo Garattoni
  - Gianpiero Francesca
  - Francois Bremond
  year: 2023
  venue: ICCV
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/ICCV2023/html/Yang_LAC_-_Latent_Action_Composition_for_Skeleton-based_Action_Segmentation_ICCV_2023_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/ICCV2023/papers/Yang_LAC_-_Latent_Action_Composition_for_Skeleton-based_Action_Segmentation_ICCV_2023_paper.pdf
  arxiv_url: http://arxiv.org/abs/2308.14500
  doi: ''
  code_url: ''
  project_url: ''
  abstract: Skeleton-based action segmentation requires recognizing composable actions in untrimmed videos. Current approaches
    decouple this problem by first extracting local visual features from skeleton sequences and then processing them by a
    temporal model to classify frame-wise actions. However, their performances remain limited as the visual features cannot
    sufficiently express composable actions. In this context, we propose Latent Action Composition (LAC), a novel self-supervised
    framework aiming at learning from synthesized composable motions for skeleton-based action segmentation. LAC is composed
    of a novel generation module towards synthesizing new sequences. Specifically, we design a linear latent space in the
    generator to represent primitive motion. New composed motions can be synthesized by simply performing arithmetic operations
    on latent representations of multiple input skeleton sequences. LAC leverages such synthesized sequences, which have large
    diversity and complexity, for learning visual representations of skeletons in both sequence and frame spaces via contrastive
    learning. The resulting visual encoder has a high expressive power and can be effectively transferred onto action segmentation
    tasks by end-to-end fine-tuning without the need for additional temporal models. We conduct a study focusing on transfer-learning
    and we show that representations learned from pre-trained LAC outperform the state-of-the-art by a large margin on TSU,
    Charades, PKU-MMD datasets.
