  official_publication_url: https://openaccess.thecvf.com/content/CVPR2023/html/van_Amsterdam_ASPnet_Action_Segmentation_With_Shared-Private_Representation_of_Multiple_Data_Sources_CVPR_2023_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/CVPR2023/papers/van_Amsterdam_ASPnet_Action_Segmentation_With_Shared-Private_Representation_of_Multiple_Data_Sources_CVPR_2023_paper.pdf
  arxiv_url: ''
  doi: ''
  code_url: ''
  project_url: ''
  abstract: Most state-of-the-art methods for action segmentation are based on single input modalities or naive fusion of
    multiple data sources. However, effective fusion of complementary information can potentially strengthen segmentation
    models and make them more robust to sensor noise and more accurate with smaller training datasets. In order to improve
    multimodal representation learning for action segmentation, we propose to disentangle hidden features of a multi-stream
    segmentation model into modality-shared components, containing common information across data sources, and private components;
    we then use an attention bottleneck to capture long-range temporal dependencies in the data while preserving disentanglement
    in consecutive processing layers. Evaluation on 50salads, Breakfast and RARP45 datasets shows that our multimodal approach
    outperforms different data fusion baselines on both multiview and multimodal data sources, obtaining competitive or better
    results compared with the state-of-the-art. Our model is also more robust to additive sensor noise and can achieve performance
    on par with strong video baselines even with less training data.
