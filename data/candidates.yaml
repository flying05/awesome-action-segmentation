  code_url: ''
  project_url: ''
  abstract: 'This paper presents a simple yet effective approach for the poorly investigated task of global action segmentation,
    aiming at grouping frames capturing the same action across videos of different activities. Unlike the case of videos depicting
    all the same activity, the temporal order of actions is not roughly shared among all videos, making the task even more
    challenging. We propose to use activity labels to learn, in a weakly-supervised fashion, action representations suitable
    for global action segmentation. For this purpose, we introduce a triadic learning approach for video pairs, to ensure
    intra-video action discrimination, as well as inter-video and inter-activity action association. For the backbone architecture,
    we use a Siamese network based on sparse transformers that takes as input video pairs and determine whether they belong
    to the same activity. The proposed approach is validated on two challenging benchmark datasets: Breakfast and YouTube
    Instructions, outperforming state-of-the-art methods.'
