- id: 2019-cvpr-ms-tcn-multi-stage-convolutional
  title: 'MS-TCN: Multi-Stage Temporal Convolutional Network for Action Segmentation'
  authors:
  - Yazan Abu Farha
  - Jurgen Gall
  year: 2019
  venue: CVPR
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content_CVPR_2019/html/Abu_Farha_MS-TCN_Multi-Stage_Temporal_Convolutional_Network_for_Action_Segmentation_CVPR_2019_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content_CVPR_2019/papers/Abu_Farha_MS-TCN_Multi-Stage_Temporal_Convolutional_Network_for_Action_Segmentation_CVPR_2019_paper.pdf
  arxiv_url: https://arxiv.org/abs/1903.01945
  doi: ''
  code_url: https://github.com/yabufarha/ms-tcn
  project_url: ''
  abstract: 'Temporally locating and classifying action segments in long untrimmed videos is of particular interest to many
    applications like surveillance and robotics. While traditional approaches follow a two-step pipeline, by generating frame-wise
    probabilities and then feeding them to high-level temporal models, recent approaches use temporal convolutions to directly
    classify the video frames. In this paper, we introduce a multi-stage architecture for the temporal action segmentation
    task. Each stage features a set of dilated temporal convolutions to generate an initial prediction that is refined by
    the next one. This architecture is trained using a combination of a classification loss and a proposed smoothing loss
    that penalizes over-segmentation errors. Extensive evaluation shows the effectiveness of the proposed model in capturing
    long-range dependencies and recognizing action segments. Our model achieves state-of-the-art results on three challenging
    datasets: 50Salads, Georgia Tech Egocentric Activities (GTEA), and the Breakfast dataset.'
