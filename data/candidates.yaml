- id: 2020-cvpr-improving-graph-based-reasoning
  title: Improving Action Segmentation via Graph-Based Temporal Reasoning
  authors:
  - Yifei Huang
  - Yusuke Sugano
  - Yoichi Sato
  year: 2020
  venue: CVPR
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content_CVPR_2020/html/Huang_Improving_Action_Segmentation_via_Graph-Based_Temporal_Reasoning_CVPR_2020_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content_CVPR_2020/papers/Huang_Improving_Action_Segmentation_via_Graph-Based_Temporal_Reasoning_CVPR_2020_paper.pdf
  arxiv_url: ''
  doi: ''
  code_url: ''
  project_url: ''
  abstract: Temporal relations among multiple action segments play an important role in action segmentation especially when
    observations are limited (e.g., actions are occluded by other objects or happen outside a field of view). In this paper,
    we propose a network module called Graph-based Temporal Reasoning Module (GTRM) that can be built on top of existing action
    segmentation models to learn the relation of multiple action segments in various time spans. We model the relations by
    using two Graph Convolution Networks (GCNs) where each node represents an action segment. The two graphs have different
    edge properties to account for boundary regression and classification tasks, respectively. By applying graph convolution,
    we can update each node's representation based on its relation with neighboring nodes. The updated representation is then
    used for improved action segmentation. We evaluate our model on the challenging egocentric datasets namely EGTEA and EPIC-Kitchens,
    where actions may be partially observed due to the viewpoint restriction. The results show that our proposed GTRM outperforms
    state-of-the-art action segmentation models by a large margin. We also demonstrate the effectiveness of our model on two
    third-person video datasets, the 50Salads dataset and the Breakfast dataset.
