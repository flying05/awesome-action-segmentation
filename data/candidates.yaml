- id: 2017-cvpr-convolutional-networks-detection
  title: Temporal Convolutional Networks for Action Segmentation and Detection
  authors:
  - Colin Lea
  - Michael D. Flynn
  - Rene Vidal
  - Austin Reiter
  - Gregory D. Hager
  year: 2017
  venue: CVPR
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content_cvpr_2017/html/Lea_Temporal_Convolutional_Networks_CVPR_2017_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content_cvpr_2017/papers/Lea_Temporal_Convolutional_Networks_CVPR_2017_paper.pdf
  arxiv_url: https://arxiv.org/abs/1611.05267
  doi: ''
  code_url: ''
  project_url: ''
  abstract: The ability to identify and temporally segment fine-grained human actions throughout a video is crucial for robotics,
    surveillance, education, and beyond. Typical approaches decouple this problem by first extracting local spatiotemporal
    features from video frames and then feeding them into a temporal classifier that captures high-level temporal patterns.
    We describe a class of temporal models, which we call Temporal Convolutional Networks (TCNs), that use a hierarchy of
    temporal convolutions to perform fine-grained action segmentation or detection. Our Encoder-Decoder TCN uses pooling and
    upsampling to efficiently capture long-range temporal patterns whereas our Dilated TCN uses dilated convolutions. We show
    that TCNs are capable of capturing action compositions, segment durations, and long-range dependencies, and are over a
    magnitude faster to train than competing LSTM-based Recurrent Neural Networks. We apply these models to three challenging
    fine-grained datasets and show large improvements over the state of the art.
