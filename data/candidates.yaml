  - Juergen Gall
  year: 2020
  venue: ECCV
  venue_tier: Top-Vision
  publication_type: conference
  official_publication_url: https://www.ecva.net/papers/eccv_2020/papers_ECCV/html/1061_ECCV_2020_paper.php
  official_pdf_url: https://www.ecva.net/papers/eccv_2020/papers_ECCV/papers/123570664.pdf
  arxiv_url: https://arxiv.org/abs/1904.03116
  doi: ''
  code_url: https://github.com/yassersouri/MuCon
  project_url: ''
  abstract: Action segmentation is the task of predicting the actions for each frame of a video. As obtaining the full annotation
    of videos for action segmentation is expensive, weakly supervised approaches that can learn only from transcripts are
    appealing. In this paper, we propose a novel end-to-end approach for weakly supervised action segmentation based on a
    two-branch neural network. The two branches of our network predict two redundant but different representations for action
    segmentation and we propose a novel mutual consistency (MuCon) loss that enforces the consistency of the two redundant
    representations. Using the MuCon loss together with a loss for transcript prediction, our proposed approach achieves the
    accuracy of state-of-the-art approaches while being $14$ times faster to train and $20$ times faster during inference.
    The MuCon loss proves beneficial even in the fully supervised setting.
