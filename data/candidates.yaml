- id: 2022-wacv-sscap-self-supervised-co-occurrence
  title: 'SSCAP: Self-Supervised Co-Occurrence Action Parsing for Unsupervised Temporal Action Segmentation'
  authors:
  - Zhe Wang
  - Hao Chen
  - Xinyu Li
  - Chunhui Liu
