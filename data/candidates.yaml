- id: 2026-eccv-learning-probabilistic-embeddings-unsupervised
  title: Learning Probabilistic Embeddings for Unsupervised Action Segmentation
  authors:
  - Shuai Li
  - Duc Manh Vu
  - Juergen Gall
  year: 2026
  venue: ECCV
  venue_tier: Top-Vision
  publication_type: conference-claimed
  official_publication_url: ''
  official_pdf_url: https://arxiv.org/pdf/2607.05263
  arxiv_url: https://arxiv.org/abs/2607.05263
  doi: ''
  code_url: ''
  project_url: ''
  abstract: This paper concerns the problem of unsupervised temporal action segmentation for long, untrimmed videos. Recent
    successful approaches follow a joint representation learning and clustering paradigm, where optimal transport (OT) is
    adopted to produce pseudo labels for learning frame representations. These approaches alternate between estimating pseudo
    labels using OT and optimizing the parameters with gradient descent during training, where OT is used for obtaining the
    final temporal action segmentation. A major limitation of these works is that they learn a deterministic embedding for
    frame representations. The iterative procedure between learning deterministic embeddings based on pseudo labels and estimating
    pseudo labels from the learned embedding can thus get quickly stuck in a local optimum. As an alternative, we thus propose
    to learn a probabilistic embedding for frame representations. The embeddings are modeled by Gaussian distributions and
    we sample from the distributions before estimating the pseudo labels. We evaluate our approach on several challenging
    temporal action segmentation datasets and achieve results comparable to, and in some cases, better than the state of the
    art. Compared to baselines with deterministic embeddings, our approach improves MoF up to 20.7\% and F1-score up to 19.0\%.
    Our code is available at https://github.com/derkbreeze/PEOT.
