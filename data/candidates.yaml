- id: 2022-eccv-leveraging-affinity-continuity-semi-supervised
  title: Leveraging Action Affinity and Continuity for Semi-Supervised Temporal Action Segmentation
  authors:
  - Guodong Ding
  - Angela Yao
  year: 2022
  venue: ECCV
  venue_tier: Top-Vision
  publication_type: conference
  official_publication_url: https://www.ecva.net/papers/eccv_2022/papers_ECCV/html/3254_ECCV_2022_paper.php
  official_pdf_url: https://www.ecva.net/papers/eccv_2022/papers_ECCV/papers/136950017.pdf
  arxiv_url: https://arxiv.org/abs/2207.08653
  doi: ''
  code_url: https://github.com/dinggd/semitas
  project_url: ''
  abstract: 'We present a semi-supervised learning approach to the temporal action segmentation task. The goal of the task
    is to temporally detect and segment actions in long, untrimmed procedural videos, where only a small set of videos are
    densely labelled, and a large collection of videos are unlabelled. To this end, we propose two novel loss functions for
    the unlabelled data: an action affinity loss and an action continuity loss. The action affinity loss guides the unlabelled
    samples learning by imposing the action priors induced from the labelled set. Action continuity loss enforces the temporal
    continuity of actions, which also provides frame-wise classification supervision. In addition, we propose an Adaptive
    Boundary Smoothing (ABS) approach to build coarser action boundaries for more robust and reliable learning. The proposed
    loss functions and ABS were evaluated on three benchmarks. Results show that they significantly improved action segmentation
    performance with a low amount (5% and 10%) of labelled data and achieved comparable results to full supervision with 50%
    labelled data. Furthermore, ABS succeeded in boosting performance when integrated into fully-supervised learning.'
