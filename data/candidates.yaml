- id: 2020-cvpr-joint-self-supervised-domain-adaptation
  title: Action Segmentation With Joint Self-Supervised Temporal Domain Adaptation
  authors:
  - Min-Hung Chen
  - Baopu Li
  - Yingze Bao
  - Ghassan AlRegib
  - Zsolt Kira
  year: 2020
  venue: CVPR
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content_CVPR_2020/html/Chen_Action_Segmentation_With_Joint_Self-Supervised_Temporal_Domain_Adaptation_CVPR_2020_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content_CVPR_2020/papers/Chen_Action_Segmentation_With_Joint_Self-Supervised_Temporal_Domain_Adaptation_CVPR_2020_paper.pdf
  arxiv_url: http://arxiv.org/abs/2003.02824
  doi: ''
  code_url: ''
  project_url: ''
  abstract: Despite the recent progress of fully-supervised action segmentation techniques, the performance is still not fully
    satisfactory. One main challenge is the problem of spatiotemporal variations (e.g. different people may perform the same
    activity in various ways). Therefore, we exploit unlabeled videos to address this problem by reformulating the action
    segmentation task as a cross-domain problem with domain discrepancy caused by spatio-temporal variations. To reduce the
    discrepancy, we propose SelfSupervised Temporal Domain Adaptation (SSTDA), which contains two self-supervised auxiliary
    tasks (binary and sequential domain prediction) to jointly align cross-domain feature spaces embedded with local and global
    temporal dynamics, achieving better performance than other Domain Adaptation (DA) approaches. On three challenging benchmark
    datasets (GTEA, 50Salads, and Breakfast), SSTDA outperforms the current state-of-the-art method by large margins (e.g.
    for the F1@25 score, from 59.6% to 69.1% on Breakfast, from 73.4% to 81.5% on 50Salads, and from 83.6% to 89.1% on GTEA),
    and requires only 65% of the labeled training data for comparable performance, demonstrating the usefulness of adapting
    to unlabeled target videos across variations. The source code is available at https://github.com/cmhungsteve/SSTDA.
