- id: 2024-cvpr-progress-aware-online-egocentric-procedural
  title: Progress-Aware Online Action Segmentation for Egocentric Procedural Task Videos
  authors:
  - Yuhan Shen
  - Ehsan Elhamifar
  year: 2024
  venue: CVPR
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/CVPR2024/html/Shen_Progress-Aware_Online_Action_Segmentation_for_Egocentric_Procedural_Task_Videos_CVPR_2024_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/CVPR2024/papers/Shen_Progress-Aware_Online_Action_Segmentation_for_Egocentric_Procedural_Task_Videos_CVPR_2024_paper.pdf
  arxiv_url: ''
  doi: ''
  code_url: ''
  project_url: ''
  abstract: We address the problem of online action segmentation for egocentric procedural task videos. While previous studies
    have mostly focused on offline action segmentation where entire videos are available for both training and inference the
    transition to online action segmentation is crucial for practical applications like AR/VR task assistants. Notably applying
    an offline-trained model directly to online inference results in a significant performance drop due to the inconsistency
    between training and inference. We propose an online action segmentation framework by first modifying existing architectures
    to make them causal. Second we develop a novel action progress prediction module to dynamically estimate the progress
    of ongoing actions and using them to refine the predictions of causal action segmentation. Third we propose to learn task
    graphs from training videos and leverage them to obtain smooth and procedure-consistent segmentations. With the combination
    of progress and task graph with casual action segmentation our framework effectively addresses prediction uncertainty
    and oversegmentation in online action segmentation and achieves significant improvement on three egocentric datasets.
