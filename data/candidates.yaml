- id: 2021-preprint-high-level-complex-activity-labels
  title: Temporal Action Segmentation with High-level Complex Activity Labels
  authors:
  - Guodong Ding
  - Angela Yao
  year: 2021
  venue: Preprint
  venue_tier: Preprint
