- id: 2014-cvpr-leveraging-hierarchical-parametric-networks-skeletal
  title: Leveraging Hierarchical Parametric Networks for Skeletal Joints Based Action Segmentation and Recognition
  authors:
  - Di Wu
  - Ling Shao
  year: 2014
  venue: CVPR
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content_cvpr_2014/html/Wu_Leveraging_Hierarchical_Parametric_2014_CVPR_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content_cvpr_2014/papers/Wu_Leveraging_Hierarchical_Parametric_2014_CVPR_paper.pdf
  arxiv_url: ''
  doi: ''
  code_url: ''
  project_url: ''
  abstract: Over the last few years, with the immense popularity of the Kinect, there has been renewed interest in developing
    methods for human gesture and action recognition from 3D skeletal data. A number of approaches have been proposed to extract
    representative features from 3D skeletal data, most commonly hard wired geometric or bio-inspired shape context features.
    We propose a hierarchial dynamic framework that first extracts high level skeletal joints features and then uses the learned
    representation for estimating emission probability to infer action sequences. Currently gaussian mixture models are the
    dominant technique for modeling the emission distribution of hidden Markov models. We show that better action recognition
    using skeletal features can be achieved by replacing gaussian mixture models by deep neural networks that contain many
    layers of features to predict probability distributions over states of hidden Markov models. The framework can be easily
    extended to include a ergodic state to segment and recognize actions simultaneously.
