- id: 2015-iccv-unsupervised-semantic-parsing-collections
  title: Unsupervised Semantic Parsing of Video Collections
  authors:
  - Ozan Sener
  - Amir R. Zamir
  - Silvio Savarese
  - Ashutosh Saxena
  year: 2015
  venue: ICCV
  venue_tier: CCF-A
