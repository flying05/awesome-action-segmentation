- id: 2019-preprint-frontal-low-rank-random-tensors
  title: Frontal Low-rank Random Tensors for Fine-grained Action Segmentation
  authors:
  - Yan Zhang
  - Krikamol Muandet
  - Qianli Ma
  - Heiko Neumann
  - Siyu Tang
  year: 2019
  venue: Preprint
  venue_tier: Preprint
