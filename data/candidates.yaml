- id: 2026-preprint-atlas-annotation-tool-long-horizon
  title: 'ATLAS: An Annotation Tool for Long-horizon Robotic Action Segmentation'
  authors:
  - Sergej Stanovcic
  - Daniel Sliwowski
  - Dongheui Lee
  year: 2026
  venue: Preprint
  venue_tier: Preprint
