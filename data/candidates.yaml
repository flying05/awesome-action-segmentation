- id: 2020-pattern-recognition-letters-hierarchical-attention-network
  title: Hierarchical Attention Network for Action Segmentation
  authors:
  - Harshala Gammulle
  - Simon Denman
  - Sridha Sridharan
  - Clinton Fookes
  year: 2020
  venue: Pattern Recognition Letters
  venue_tier: Journal
  publication_type: journal-claimed
