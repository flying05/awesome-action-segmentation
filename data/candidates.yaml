- id: 2016-eccv-segmental-spatiotemporal-cnns-fine-grained
  title: Segmental Spatiotemporal CNNs for Fine-Grained Action Segmentation
  authors:
  - Colin Lea
  - Austin Reiter
  - Rene Vidal
  - Gregory D. Hager
  year: 2016
  venue: ECCV
  venue_tier: Top-Vision
  publication_type: conference
  official_publication_url: https://link.springer.com/chapter/10.1007/978-3-319-46487-9_3
  official_pdf_url: https://arxiv.org/pdf/1602.02995
  arxiv_url: https://arxiv.org/abs/1602.02995
  doi: 10.1007/978-3-319-46487-9_3
  code_url: ''
  project_url: ''
  abstract: Joint segmentation and classification of fine-grained actions is important for applications of human-robot interaction,
    video surveillance, and human skill evaluation. However, despite substantial recent progress in large-scale action classification,
    the performance of state-of-the-art fine-grained action recognition approaches remains low. We propose a model for action
    segmentation which combines low-level spatiotemporal features with a high-level segmental classifier. Our spatiotemporal
    CNN is comprised of a spatial component that uses convolutional filters to capture information about objects and their
    relationships, and a temporal component that uses large 1D convolutional filters to capture information about how object
    relationships change across time. These features are used in tandem with a semi-Markov model that models transitions from
    one action to another. We introduce an efficient constrained segmental inference algorithm for this model that is orders
    of magnitude faster than the current approach. We highlight the effectiveness of our Segmental Spatiotemporal CNN on cooking
    and surgical action datasets for which we observe substantially improved performance relative to recent baseline methods.
