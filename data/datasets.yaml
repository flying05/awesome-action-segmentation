- name: Breakfast Actions
  domain: daily activities
  modality: RGB
  number_of_videos: 1712
  number_of_actions: 48
  average_video_length: "about 2.3 minutes; protocol-dependent after feature sampling"
  view: multi-view exocentric
  annotation_type: frame-level fine-grained actions
  official_url: https://serre-lab.clps.brown.edu/resource/breakfast-actions-dataset/
  commonly_used_splits: four-fold cross-validation
  common_metrics: [MoF, Edit, F1@10, F1@25, F1@50]
  representative_papers: [2014-cvpr-breakfast, 2019-cvpr-ms-tcn]
  notes: "1712 videos and 48 fine-grained classes are reported by the dataset paper; some works exclude silence/background differently."
- name: 50Salads
  domain: food preparation
  modality: RGB, depth, accelerometer
  number_of_videos: 50
  number_of_actions: 17
  average_video_length: "5–10 minutes"
  view: exocentric
  annotation_type: frame-level actions at multiple granularities
  official_url: https://cvip.computing.dundee.ac.uk/datasets/foodpreparation/50salads/
