- id: 2023-preprint-casr-refining-marginalizing-frame-levle
  title: 'CASR: Refining Action Segmentation via Marginalizing Frame-levle Causal Relationships'
  authors:
  - Keqing Du
  - Xinyu Yang
  - Hang Chen
  year: 2023
  venue: Preprint
  venue_tier: Preprint
  publication_type: preprint
  official_publication_url: ''
