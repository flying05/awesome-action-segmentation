  abstract: Dataset condensation for action segmentation synthesizes compact, informative representations of long, untrimmed
    video datasets. The existing approach relies on Variational Autoencoders and an iterative latent optimization; it is computationally
    expensive and suffers from over-smoothed reconstructions and rigid temporal constraints. This paper proposes to shift
    the condensation paradigm from optimization-based inversion to deterministic latent mapping. By leveraging Denoising Diffusion
    Implicit Models, we represent action segments as continuous trajectories anchored by sparse latent points in the noise
    manifold. To maximize representational efficiency, we introduce an adaptive allocation mechanism that dynamically redistributes
    the anchoring budget based on segment-wise reconstruction difficulty. Extensive experiments demonstrate that our framework
    significantly outperforms state-of-the-art methods in segmentation performance across common datasets. Notably, our approach
    achieves performance parity with real data training while maintaining a condensation ratio of 2.4\% on Breakfast dataset.
