- id: 2022-preprint-cross-enhancement-transformer
  title: Cross-Enhancement Transformer for Action Segmentation
  authors:
  - Jiahui Wang
  - Zhenyou Wang
  - Shanna Zhuang
  - Hui Wang
  year: 2022
  venue: Preprint
  venue_tier: Preprint
