- id: 2024-wacv-random-walks-timestamp-supervision
  title: Random Walks for Temporal Action Segmentation With Timestamp Supervision
  authors:
  - Roy Hirsch
  - Regev Cohen
  - Tomer Golany
  - Daniel Freedman
  - Ehud Rivlin
  year: 2024
  venue: WACV
  venue_tier: Top-Vision
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/WACV2024/html/Hirsch_Random_Walks_for_Temporal_Action_Segmentation_With_Timestamp_Supervision_WACV_2024_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/WACV2024/papers/Hirsch_Random_Walks_for_Temporal_Action_Segmentation_With_Timestamp_Supervision_WACV_2024_paper.pdf
  arxiv_url: ''
  doi: ''
  code_url: ''
  project_url: ''
  abstract: 'Temporal action segmentation relates to high-level video understanding, commonly formulated as frame-wise classification
    of untrimmed videos into predefined actions. Fully-supervised deep-learning approaches require dense video annotations
    which are time and money consuming. Furthermore, the temporal boundaries between consecutive actions typically are not
    well-defined, leading to inherent ambiguity and inter-rater disagreement. A promising approach to remedy these limitations
    is timestamp supervision, requiring only one labeled frame per action instance in a training video. In this work, we reformulate
    the task of temporal segmentation as a graph segmentation problem with weakly-labeled vertices. We introduce an efficient
    segmentation method based on random walks on graphs, obtained by solving a sparse system of linear equations. Furthermore,
    the proposed technique can be employed in any one or combination of the following forms: (1) as a standalone solution
    for generating dense pseudo-labels from timestamps; (2) as a training loss; (3) as a smoothing mechanism given intermediate
    predictions. Extensive experiments with three datasets (50Salads, Breakfast, GTEA) show that our method competes with
    state-of-the-art, and allows the identification of regions of uncertainty around action boundaries.'
