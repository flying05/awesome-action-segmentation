- id: 2020-preprint-evaluating-weakly-supervised-methods
  title: On Evaluating Weakly Supervised Action Segmentation Methods
  authors:
  - Yaser Souri
  - Alexander Richard
  - Luca Minciullo
  - Juergen Gall
  year: 2020
  venue: Preprint
  venue_tier: Preprint
  publication_type: preprint
