- id: 2023-preprint-ms-tcrnet-multi-stage-convolutional
  title: 'MS-TCRNet: Multi-Stage Temporal Convolutional Recurrent Networks for Action Segmentation Using Sensor-Augmented
    Kinematics'
  authors:
  - Adam Goldbraikh
  - Omer Shubi
  - Or Rubin
  - Carla M Pugh
  - Shlomi Laufer
  year: 2023
  venue: Preprint
