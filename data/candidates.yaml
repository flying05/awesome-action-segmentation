- id: 2026-preprint-data-efficient-surgical-phase-small
  title: 'Data-Efficient Surgical Phase Segmentation in Small-Incision Cataract Surgery: A Controlled Study of Vision Foundation
    Models'
  authors:
  - Lincoln Spencer
  - Song Wang
  - Chen Chen
  year: 2026
  venue: Preprint
  venue_tier: Preprint
