  code_url: ''
  project_url: ''
  abstract: Skeleton-based Temporal Action Segmentation (STAS) aims to segment and recognize various actions from long, untrimmed
    sequences of human skeletal movements. Current STAS methods typically employ spatio-temporal modeling to establish dependencies
    among joints as well as frames, and utilize one-hot encoding with cross-entropy loss for frame-wise classification supervision.
    However, these methods overlook the intrinsic correlations among joints and actions within skeletal features, leading
    to a limited understanding of human movements. To address this, we propose a Text-Derived Relational Graph-Enhanced Network
    (TRG-Net) that leverages prior graphs generated by Large Language Models (LLM) to enhance both modeling and supervision.
    For modeling, the Dynamic Spatio-Temporal Fusion Modeling (DSFM) method incorporates Text-Derived Joint Graphs (TJG) with
    channel- and frame-level dynamic adaptation to effectively model spatial relations, while integrating spatio-temporal
    core features during temporal modeling. For supervision, the Absolute-Relative Inter-Class Supervision (ARIS) method employs
    contrastive learning between action features and text embeddings to regularize the absolute class distributions, and utilizes
    Text-Derived Action Graphs (TAG) to capture the relative inter-class relationships among action features. Additionally,
    we propose a Spatial-Aware Enhancement Processing (SAEP) method, which incorporates random joint occlusion and axial rotation
    to enhance spatial generalization. Performance evaluations on four public datasets demonstrate that TRG-Net achieves state-of-the-art
    results.
