  code_url: ''
  project_url: ''
  abstract: We propose a novel hierarchical spatiotemporal vector quantization framework for unsupervised skeleton-based temporal
    action segmentation. We first introduce a hierarchical approach, which includes two consecutive levels of vector quantization.
    Specifically, the lower level associates skeletons with fine-grained subactions, while the higher level further aggregates
    subactions into action-level representations. Our hierarchical approach outperforms the non-hierarchical baseline, while
    primarily exploiting spatial cues by reconstructing input skeletons. Next, we extend our approach by leveraging both spatial
    and temporal information, yielding a hierarchical spatiotemporal vector quantization scheme. In particular, our hierarchical
    spatiotemporal approach performs multi-level clustering, while simultaneously recovering input skeletons and their corresponding
    timestamps. Lastly, extensive experiments on multiple benchmarks, including HuGaDB, LARa, and BABEL, demonstrate that
    our approach establishes a new state-of-the-art performance and reduces segment length bias in unsupervised skeleton-based
    temporal action segmentation.
