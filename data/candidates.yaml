- id: 2025-iccv-clot-closed-loop-optimal-transport
  title: 'CLOT: Closed Loop Optimal Transport for Unsupervised Action Segmentation'
  authors:
  - Elena Bueno-Benito
  - Mariella Dimiccoli
  year: 2025
  venue: ICCV
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/ICCV2025/html/Bueno-Benito_CLOT_Closed_Loop_Optimal_Transport_for_Unsupervised_Action_Segmentation_ICCV_2025_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/ICCV2025/papers/Bueno-Benito_CLOT_Closed_Loop_Optimal_Transport_for_Unsupervised_Action_Segmentation_ICCV_2025_paper.pdf
  arxiv_url: http://arxiv.org/abs/2507.03539
  doi: ''
  code_url: ''
  project_url: ''
  abstract: Unsupervised action segmentation has recently pushed its limits with ASOT, an optimal transport (OT)-based method
    that simultaneously learns action representations and performs clustering using pseudo-labels. Unlike other OT-based approaches,
    ASOT makes no assumptions about action ordering and can decode a temporally consistent segmentation from a noisy cost
    matrix between video frames and action labels. However, the resulting segmentation lacks segment-level supervision, limiting
    the effectiveness of feedback between frames and action representations. To address this limitation, we propose Closed
    Loop Optimal Transport (CLOT), a novel OT-based framework with a multi-level cyclic feature learning mechanism. Leveraging
    its encoder-decoder architecture, CLOT learns pseudo-labels alongside frame and segment embeddings by solving two separate
    OT problems. It then refines both frame embeddings and pseudo-labels through cross-attention between the learned frame
    and segment embeddings, by integrating a third OT problem. Experimental results on four benchmark datasets demonstrate
    the benefits of cyclical learning for unsupervised action segmentation.
  keywords:
  - temporal action segmentation
  task_categories:
  - Temporal Action Segmentation
  supervision:
  - unsupervised
  modality:
