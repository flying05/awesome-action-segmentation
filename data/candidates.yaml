- id: 2020-wacv-stacked-spatio-graph-convolutional-networks
  title: Stacked Spatio-Temporal Graph Convolutional Networks for Action Segmentation
  authors:
  - Pallabi Ghosh
  - Yi Yao
  - Larry Davis
  - Ajay Divakaran
  year: 2020
  venue: WACV
  venue_tier: Top-Vision
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content_WACV_2020/html/Ghosh_Stacked_Spatio-Temporal_Graph_Convolutional_Networks_for_Action_Segmentation_WACV_2020_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content_WACV_2020/papers/Ghosh_Stacked_Spatio-Temporal_Graph_Convolutional_Networks_for_Action_Segmentation_WACV_2020_paper.pdf
  arxiv_url: https://arxiv.org/abs/1811.10575
  doi: ''
  code_url: ''
  project_url: ''
  abstract: We propose novel Stacked Spatio-Temporal Graph Convolutional Networks (Stacked-STGCN) for action segmentation,
    i.e., predicting and localizing a sequence of actions over long videos. We extend the Spatio-Temporal Graph Convolutional
    Network (STGCN) originally proposed for skeleton-based action recognition to enable nodes with different characteristics
    (e.g., scene, actor, object, action), feature descriptors with varied lengths, and arbitrary temporal edge connections
    to account for large graph deformation commonly associated with complex activities. We further introduce the stacked hourglass
    architecture to STGCN to leverage the advantages of an encoder-decoder design for improved generalization performance
    and localization accuracy. We explore various descriptors such as frame-level VGG, segment-level I3D, RCNN-based object,
    etc. as node descriptors to enable action segmentation based on joint inference over comprehensive contextual information.
    We show results on CAD120 (which provides pre-computed node features and edge weights for fair performance comparison
    across algorithms) as well as a more complex real world activity dataset, Charades. Our Stacked-STGCN in general achieves
    improved performance over the state-of-the-art for both CAD120 and Charades. Moreover, due to its generic design, Stacked-STGCN
    can be applied to a wider range of applications that require structured inference over long sequences with heterogeneous
    data types and varied temporal extent.
