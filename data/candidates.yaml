  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/ICCV2025/html/Ali_Joint_Self-Supervised_Video_Alignment_and_Action_Segmentation_ICCV_2025_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/ICCV2025/papers/Ali_Joint_Self-Supervised_Video_Alignment_and_Action_Segmentation_ICCV_2025_paper.pdf
  arxiv_url: http://arxiv.org/abs/2503.16832
  doi: ''
  code_url: ''
  project_url: ''
  abstract: We introduce a novel approach for simultaneous self-supervised video alignment and action segmentation based on
    a unified optimal transport framework. In particular, we first tackle self-supervised video alignment by developing a
    fused Gromov-Wasserstein optimal transport formulation with a structural prior, which trains efficiently on GPUs and needs
    only a few iterations for solving the optimal transport problem. Our single-task method achieves the state-of-the-art
    performance on multiple video alignment benchmarks and outperforms VAVA, which relies on a traditional Kantorovich optimal
    transport formulation with an optimality prior. Furthermore, we extend our approach by proposing a unified optimal transport
    framework for joint self-supervised video alignment and action segmentation, which requires training and storing a single
    model and saves both time and memory consumption as compared to two different single-task models. Extensive evaluations
    on several video alignment and action segmentation datasets demonstrate that our multi-task method achieves comparable
    video alignment yet superior action segmentation results over previous methods in video alignment and action segmentation
    respectively. Finally, to the best of our knowledge, this is the first work to unify video alignment and action segmentation
    into a single model.
