- id: 2025-iccv-multi-modal-few-shot
  title: Multi-Modal Few-Shot Temporal Action Segmentation
  authors:
  - Zijia Lu
  - Ehsan Elhamifar
  year: 2025
  venue: ICCV
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/ICCV2025/html/Lu_Multi-Modal_Few-Shot_Temporal_Action_Segmentation_ICCV_2025_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/ICCV2025/papers/Lu_Multi-Modal_Few-Shot_Temporal_Action_Segmentation_ICCV_2025_paper.pdf
  arxiv_url: ''
  doi: ''
  code_url: https://github.com/ZijiaLewisLu/ICCV2025-MMF-TAS
  project_url: ''
  abstract: Procedural videos are critical for learning new tasks. Temporal action segmentation (TAS), which classifies the
    action in every video frame, has become essential for understanding procedural videos. Existing TAS models, however, learn
    a fixed-set of tasks at training and unable to adapt to novel tasks at test time. Thus, we introduce the new problem of
    Multi-Modal Few-shot Temporal Action Segmentation (MMF-TAS) to learn open-set models that can generalize to novel procedural
    tasks with minimal visual/textual examples. We propose the first MMF-TAS framework, by designing a Prototype Graph Network
    (PGNet). In PGNet, a Prototype Building Block summarizes action information from support videos of the novel tasks via
    an Action Relation Graph, and encodes this information into action prototypes via a Dynamic Graph Transformer. Next, a
    Matching Block compares action prototypes with query videos to infer framewise action labels. To exploit the advantages
    of both visual and textual modalities, we compute separate action prototypes for each modality and combine the two modalities
    through prediction fusion to avoid overfitting on one modality. By extensive experiments on procedural datasets, we show
    our method successfully adapts to novel tasks during inference and significantly outperforms baselines. Our code is available
    at https://github.com/ZijiaLewisLu/ICCV2025-MMF-TAS.
