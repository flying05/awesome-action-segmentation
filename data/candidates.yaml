- id: 2021-iccv-refining-hierarchical-representations
  title: Refining Action Segmentation With Hierarchical Video Representations
  authors:
  - Hyemin Ahn
  - Dongheui Lee
  year: 2021
  venue: ICCV
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/ICCV2021/html/Ahn_Refining_Action_Segmentation_With_Hierarchical_Video_Representations_ICCV_2021_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/ICCV2021/papers/Ahn_Refining_Action_Segmentation_With_Hierarchical_Video_Representations_ICCV_2021_paper.pdf
  arxiv_url: ''
  doi: ''
  code_url: ''
  project_url: ''
  abstract: In this paper, we propose Hierarchical Action Segmentation Refiner (HASR), which can refine temporal action segmentation
    results from various models by understanding the overall context of a given video in a hierarchical way. When a backbone
    model for action segmentation estimates how the given video can be segmented, our model extracts segment-level representations
    based on frame-level features, and extracts a video-level representation based on the segment-level representations. Based
    on these hierarchical representations, our model can refer to the overall context of the entire video, and predict how
    the segment labels that are out of context should be corrected. Our HASR can be plugged into various action segmentation
    models (MS-TCN, SSTDA, ASRF), and improve the performance of state-of-the-art models based on three challenging datasets
    (GTEA, 50Salads, and Breakfast). For example, in 50Salads dataset, the segmental edit score improves from 67.9% to 77.4%
    (MS-TCN), from 75.8% to 77.3% (SSTDA), from 79.3% to 81.0% (ASRF). In addition, our model can refine the segmentation
    result from the unseen backbone model, which was not referred to when training HASR. This generalization performance would
    make HASR be an effective tool for boosting up the existing approaches for temporal action segmentation. Our code is available
    at https://github.com/cotton-ahn/HASR_iccv2021.
