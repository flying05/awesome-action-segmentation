- id: 2024-preprint-language-assisted-human-part-motion
  title: Language-Assisted Human Part Motion Learning for Skeleton-Based Temporal Action Segmentation
  authors:
  - Bowen Chen
  - Haoyu Ji
  - Zhiyong Wang
  - Benjamin Filtjens
  - Chunzhuo Wang
  - Weihong Ren
