- id: 2022-preprint-hand-guided-high-resolution-feature
  title: Hand Guided High Resolution Feature Enhancement for Fine-Grained Atomic Action Segmentation within Complex Human
    Assemblies
  authors:
  - Matthew Kent Myers
  - Nick Wright
  - Stephen McGough
  - Nicholas Martin
  year: 2022
  venue: Preprint
