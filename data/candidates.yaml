  official_publication_url: https://openaccess.thecvf.com/content/CVPR2026/html/Ji_Spectral_Scalpel_Amplifying_Adjacent_Action_Discrepancy_via_Frequency-Selective_Filtering_for_CVPR_2026_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/CVPR2026/papers/Ji_Spectral_Scalpel_Amplifying_Adjacent_Action_Discrepancy_via_Frequency-Selective_Filtering_for_CVPR_2026_paper.pdf
  arxiv_url: https://arxiv.org/abs/2603.24134
  doi: ''
  code_url: ''
  project_url: ''
  abstract: Skeleton-based Temporal Action Segmentation (STAS) seeks to densely segment and classify diverse actions within
    long, untrimmed skeletal motion sequences. However, existing STAS methodologies face challenges of limited inter-class
    discriminability and blurred segmentation boundaries, primarily due to insufficient distinction of spatio-temporal patterns
    between adjacent actions. To address these limitations, we propose Spectral Scalpel, a frequency-selective filtering framework
    aimed at suppressing shared frequency components between adjacent distinct actions while amplifying their action-specific
    frequencies, thereby enhancing inter-action discrepancies and sharpening transition boundaries. Specifically, Spectral
    Scalpel employs adaptive multi-scale spectral filters as scalpels to edit frequency spectra, coupled with a discrepancy
    loss between adjacent actions serving as the surgical objective. This design amplifies representational disparities between
    neighboring actions, effectively mitigating boundary localization ambiguities and inter-class confusion. Furthermore,
    complementing long-term temporal modeling, we introduce a frequency-aware channel mixer to strengthen channel evolution
    by aggregating spectra across channels. This work presents a novel paradigm for STAS that extends conventional spatio-temporal
    modeling by incorporating frequency-domain analysis. Extensive experiments on five public datasets demonstrate that Spectral
    Scalpel achieves state-of-the-art performance. Code is available at https://github.com/HaoyuJi/SpecScalpel.
