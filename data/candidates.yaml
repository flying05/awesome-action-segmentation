- id: 2023-cvpr-workshop-leveraging-triplet-loss-unsupervised
  title: Leveraging Triplet Loss for Unsupervised Action Segmentation
  authors:
  - Elena Belen Bueno-Benito
  - Biel Tura Vecino
  - Mariella Dimiccoli
  year: 2023
  venue: CVPR Workshop
  venue_tier: Extended-Vision
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/CVPR2023W/L3D-IVU/html/Bueno-Benito_Leveraging_Triplet_Loss_for_Unsupervised_Action_Segmentation_CVPRW_2023_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/CVPR2023W/L3D-IVU/papers/Bueno-Benito_Leveraging_Triplet_Loss_for_Unsupervised_Action_Segmentation_CVPRW_2023_paper.pdf
  arxiv_url: https://arxiv.org/abs/2304.06403
  doi: ''
  code_url: ''
  project_url: ''
  abstract: In this paper, we propose a novel fully unsupervised framework that learns action representations suitable for
    the action segmentation task from the single input video itself, without requiring any training data. Our method is a
    deep metric learning approach rooted in a shallow network with a triplet loss operating on similarity distributions and
    a novel triplet selection strategy that effectively models temporal and semantic priors to discover actions in the new
    representational space. Under these circumstances, we successfully recover temporal boundaries in the learned action representations
    with higher quality compared with existing unsupervised approaches. The proposed method is evaluated on two widely used
    benchmark datasets for the action segmentation task and it achieves competitive performance by applying a generic clustering
    algorithm on the learned representations.
