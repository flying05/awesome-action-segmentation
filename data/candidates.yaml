- id: 2023-preprint-synchronization-is-all-you-need
  title: 'Synchronization is All You Need: Exocentric-to-Egocentric Transfer for Temporal Action Segmentation with Unlabeled
    Synchronized Video Pairs'
  authors:
  - Camillo Quattrocchi
  - Antonino Furnari
  - Daniele Di Mauro
  - Mario Valerio Giuffrida
  - Giovanni Maria Farinella
  year: 2023
  venue: Preprint
