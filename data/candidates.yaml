- id: 2022-preprint-do-we-really-need-convolutions
  title: Do we really need temporal convolutions in action segmentation?
  authors:
  - Dazhao Du
  - Bing Su
  - Yu Li
  - Zhongang Qi
  - Lingyu Si
  - Ying Shan
  year: 2022
  venue: Preprint
  venue_tier: Preprint
