- id: 2019-iccv-unsupervised-procedure-learning-joint-dynamic
  title: Unsupervised Procedure Learning via Joint Dynamic Summarization
  authors:
  - Ehsan Elhamifar
  - Zwe Naing
  year: 2019
  venue: ICCV
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content_ICCV_2019/html/Elhamifar_Unsupervised_Procedure_Learning_via_Joint_Dynamic_Summarization_ICCV_2019_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content_ICCV_2019/papers/Elhamifar_Unsupervised_Procedure_Learning_via_Joint_Dynamic_Summarization_ICCV_2019_paper.pdf
  arxiv_url: ''
  doi: ''
  code_url: ''
  project_url: ''
  abstract: We address the problem of unsupervised procedure learning from unconstrained instructional videos. Our goal is
    to produce a summary of the procedure key-steps and their ordering needed to perform a given task, as well as localization
    of the key-steps in videos. We develop a collaborative sequential subset selection framework, where we build a dynamic
    model on videos by learning states and transitions between them, where states correspond to different subactivities, including
    background and procedure steps. To extract procedure key-steps, we develop an optimization framework that finds a sequence
    of a small number of states that well represents all videos and is compatible with the state transition model. Given that
    our proposed optimization is non-convex and NP-hard, we develop a fast greedy algorithm whose complexity is linear in
    the length of the videos and the number of states of the dynamic model, hence, scales to large datasets. Under appropriate
    conditions on the transition model, our proposed formulation is approximately submodular, hence, comes with performance
    guarantees. We also present ProceL, a new multimodal dataset of 47.3 hours of videos and their transcripts from diverse
    tasks, for procedure learning evaluation. By extensive experiments, we show that our framework significantly improves
    the state of the art performance.
