  year: 2025
  venue: ICCV Workshop
  venue_tier: Extended-Vision
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/ICCV2025W/SVU/html/Wang_End-to-End_Action_Segmentation_Transformer_ICCVW_2025_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/ICCV2025W/SVU/papers/Wang_End-to-End_Action_Segmentation_Transformer_ICCVW_2025_paper.pdf
  arxiv_url: https://arxiv.org/abs/2503.06316
  doi: ''
  code_url: https://github.com/tqosu/EAST
  project_url: ''
  abstract: 'Most recent work on action segmentation relies on pre-computed frame features from models trained on other tasks
    and typically focuses on framewise encoding and labeling without explicitly modeling action segments. To overcome these
    limitations, we introduce the End-to-End Action Segmentation Transformer (EAST), which processes raw video frames directly
    -- eliminating the need for pre-extracted features and enabling true end-to-end training. Our contributions are as follows:
    (1) a lightweight adapter design for effective fine-tuning of large backbones; (2) an efficient segmentation-by-detection
    framework for leveraging action proposals predicted over a coarsely downsampled video; and (3) a novel action-proposal-based
    data augmentation strategy. EAST achieves SOTA performance on standard benchmarks, including GTEA, 50Salads, Breakfast,
    and Assembly-101.'
