- id: 2016-cvpr-unsupervised-learning-narrated-instruction-videos
  title: Unsupervised Learning From Narrated Instruction Videos
  authors:
  - Jean-Baptiste Alayrac
  - Piotr Bojanowski
  - Nishant Agrawal
  - Josef Sivic
  - Ivan Laptev
  - Simon Lacoste-Julien
  year: 2016
