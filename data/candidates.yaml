  abstract: 'Temporal Action Segmentation (TAS) requires dividing videos into action segments, yet the vast space of activities
    and alternative breakdowns makes collecting comprehensive datasets infeasible. Existing methods remain limited to closed
    vocabularies and fixed label sets. In this work, we explore the largely unexplored problem of Open-Vocabulary Zero-Shot
    Temporal Action Segmentation (OVTAS) by leveraging the strong zero-shot capabilities of Vision-Language Models (VLMs).
    We introduce a training-free pipeline that follows a segmentation-by-classification design: Frame-Action Embedding Similarity
    (FAES) matches video frames to candidate action labels, and Similarity-Matrix Temporal Segmentation (SMTS) enforces temporal
    consistency. Beyond proposing OVTAS, we present a systematic study across 14 diverse VLMs, providing the first broad analysis
    of their suitability for open-vocabulary action segmentation. Experiments on standard benchmarks show that OVTAS achieves
    strong results without task-specific supervision, underscoring the potential of VLMs for structured temporal understanding.'
