- id: 2026-icpr-deep-kernel-approximation-unsupervised
  title: Deep Kernel Video Approximation for Unsupervised Action Segmentation
  authors:
  - Silvia L. Pintea
  - Jouke Dijkstra
  year: 2026
  venue: ICPR
  venue_tier: Extended-Vision
  publication_type: conference-accepted
  official_publication_url: https://icpr2026.org/acceptedPapers.html
  official_pdf_url: https://silvialaurapintea.github.io/pub/icpr26.pdf
  arxiv_url: https://arxiv.org/abs/2604.21572
  doi: ''
  code_url: ''
  project_url: ''
  abstract: This work focuses on per-video unsupervised action segmentation, which is of interest to applications where storing
    large datasets is either not possible, or nor permitted. We propose to segment videos by learning in deep kernel space,
    to approximate the underlying frame distribution, as closely as possible. To define this closeness metric between the
    original video distribution and its approximation, we rely on maximum mean discrepancy (MMD) which is a geometry-preserving
    metric in distribution space, and thus gives more reliable estimates. Moreover, unlike the commonly used optimal transport
    metric, MMD is both easier to optimize, and faster. We choose to use neural tangent kernels (NTKs) to define the kernel
    space where MMD operates, because of their improved descriptive power as opposed to fixed kernels. And, also, because
    NTKs sidestep the trivial solution, when jointly learning the inputs (video approximation) and the kernel function. Finally,
    we show competitive results when compared to state-of-the-art per-video methods, on six standard benchmarks. Additionally,
    our method has higher F1 scores than prior agglomerative work, when the number of segments is unknown.
