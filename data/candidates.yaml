- id: 2023-cvpr-reducing-label-bias-timestamp-supervised
  title: Reducing the Label Bias for Timestamp Supervised Temporal Action Segmentation
  authors:
  - Kaiyuan Liu
  - Yunheng Li
  - Shenglan Liu
  - Chenwei Tan
  - Zihang Shao
  year: 2023
  venue: CVPR
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/CVPR2023/html/Liu_Reducing_the_Label_Bias_for_Timestamp_Supervised_Temporal_Action_Segmentation_CVPR_2023_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/CVPR2023/papers/Liu_Reducing_the_Label_Bias_for_Timestamp_Supervised_Temporal_Action_Segmentation_CVPR_2023_paper.pdf
  arxiv_url: ''
  doi: ''
  code_url: ''
  project_url: ''
  abstract: 'Timestamp supervised temporal action segmentation (TSTAS) is more cost-effective than fully supervised counterparts.
    However, previous approaches suffer from severe label bias due to over-reliance on sparse timestamp annotations, resulting
    in unsatisfactory performance. In this paper, we propose the Debiasing-TSTAS (D-TSTAS) framework by exploiting unannotated
    frames to alleviate this bias from two phases: 1) Initialization. To reduce the dependencies on annotated frames, we propose
    masked timestamp predictions (MTP) to ensure that initialized model captures more contextual information. 2) Refinement.
    To overcome the limitation of the expressiveness from sparsely annotated timestamps, we propose a center-oriented timestamp
    expansion (CTE) approach to progressively expand pseudo-timestamp groups which contain semantic-rich motion representation
    of action segments. Then, these pseudo-timestamp groups and the model output are used to iteratively generate pseudo-labels
    for refining the model in a fully supervised setup. We further introduce segmental confidence loss to enable the model
    to have high confidence predictions within the pseudo-timestamp groups and more accurate action boundaries. Our D-TSTAS
    outperforms the state-of-the-art TSTAS method as well as achieves competitive results compared with fully supervised approaches
    on three benchmark datasets.'
