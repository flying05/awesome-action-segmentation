  code_url: ''
  project_url: ''
  abstract: We address the task of supervised action segmentation which aims to partition a video into non-overlapping segments,
    each representing a different action. Recent works apply transformers to perform temporal modeling at the frame-level,
    which suffer from high computational cost and cannot well capture action dependencies over long temporal horizons. To
    address these issues, we propose an efficient BI-level Temporal modeling (BIT) framework that learns explicit action tokens
    to represent action segments, in parallel performs temporal modeling on frame and action levels, while maintaining a low
    computational cost. Our model contains (i) a frame branch that uses convolution to learn frame-level relationships, (ii)
    an action branch that uses transformer to learn action-level dependencies with a small set of action tokens and (iii)
    cross-attentions to allow communication between the two branches. We apply and extend a set-prediction objective to allow
    each action token to represent one or multiple action segments, thus can avoid learning a large number of tokens over
    long videos with many segments. Thanks to the design of our action branch, we can also seamlessly leverage textual transcripts
    of videos (when available) to help action segmentation by using them to initialize the action tokens. We evaluate our
    model on four video datasets (two egocentric and two third-person) for action segmentation with and without transcripts,
    showing that BIT significantly improves the state-of-the-art accuracy with much lower computational cost (30 times faster)
    compared to existing transformer-based methods.
