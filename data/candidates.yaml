- id: 2026-cvpr-spectral-scalpel-amplifying-adjacent-discrepancy
  title: 'Spectral Scalpel: Amplifying Adjacent Action Discrepancy via Frequency-Selective Filtering for Skeleton-Based Action
    Segmentation'
  authors:
  - Haoyu Ji
  - Bowen Chen
  - Zhihao Yang
  - Wenze Huang
  - Yu Gao
  - Xueting Liu
  - Weihong Ren
  - Zhiyong Wang
