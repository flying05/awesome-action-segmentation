- id: 2025-preprint-text-derived-relational-graph-enhanced
  title: Text-Derived Relational Graph-Enhanced Network for Skeleton-Based Action Segmentation
  authors:
  - Haoyu Ji
  - Bowen Chen
  - Weihong Ren
  - Wenze Huang
  - Zhihao Yang
  - Zhiyong Wang
  - Honghai Liu
  year: 2025
