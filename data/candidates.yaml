- id: 2025-iccv-joint-self-supervised-alignment
  title: Joint Self-Supervised Video Alignment and Action Segmentation
  authors:
  - Ali Shah Ali
  - Syed Ahmed Mahmood
  - Mubin Saeed
  - Andrey Konin
  - M. Zeeshan Zia
  - Quoc-Huy Tran
  year: 2025
