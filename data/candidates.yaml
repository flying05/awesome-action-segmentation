- id: 2018-preprint-local-bilinear-pooling-fine-grained
  title: Local Temporal Bilinear Pooling for Fine-grained Action Parsing
  authors:
  - Yan Zhang
  - Siyu Tang
  - Krikamol Muandet
  - Christian Jarvers
  - Heiko Neumann
  year: 2018
  venue: Preprint
  venue_tier: Preprint
  publication_type: preprint
  official_publication_url: ''
  official_pdf_url: https://arxiv.org/pdf/1812.01922
  arxiv_url: https://arxiv.org/abs/1812.01922
  doi: ''
  code_url: ''
  project_url: ''
  abstract: Fine-grained temporal action parsing is important in many applications, such as daily activity understanding,
    human motion analysis, surgical robotics and others requiring subtle and precise operations in a long-term period. In
    this paper we propose a novel bilinear pooling operation, which is used in intermediate layers of a temporal convolutional
    encoder-decoder net. In contrast to other work, our proposed bilinear pooling is learnable and hence can capture more
    complex local statistics than the conventional counterpart. In addition, we introduce exact lower-dimension representations
    of our bilinear forms, so that the dimensionality is reduced with neither information loss nor extra computation. We perform
    intensive experiments to quantitatively analyze our model and show the superior performances to other state-of-the-art
