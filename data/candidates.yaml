- id: 2017-cvpr-weakly-supervised-learning-rnn-based
  title: Weakly Supervised Action Learning With RNN Based Fine-To-Coarse Modeling
  authors:
  - Alexander Richard
  - Hilde Kuehne
  - Juergen Gall
  year: 2017
  venue: CVPR
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content_cvpr_2017/html/Richard_Weakly_Supervised_Action_CVPR_2017_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content_cvpr_2017/papers/Richard_Weakly_Supervised_Action_CVPR_2017_paper.pdf
  arxiv_url: http://arxiv.org/abs/1703.08132v3
  doi: ''
  code_url: ''
  project_url: ''
  abstract: We present an approach for weakly supervised learning of human actions. Given a set of videos and an ordered list
    of the occurring actions, the goal is to infer start and end frames of the related action classes within the video and
    to train the respective action classifiers without any need for hand labeled frame boundaries. To address this task, we
    propose a combination of a discriminative representation of subactions, modeled by a recurrent neural network, and a coarse
    probabilistic model to allow for a temporal alignment and inference over long sequences. While this system alone already
    generates good results, we show that the performance can be further improved by approximating the number of subactions
    to the characteristics of the different action classes. To this end, we adapt the number of subaction classes by iterating
    realignment and reestimation during training. The proposed system is evaluated on two benchmark datasets, the Breakfast
    and the Hollywood extended dataset, showing a competitive performance on various weak learning tasks such as temporal
    action segmentation and action alignment.
