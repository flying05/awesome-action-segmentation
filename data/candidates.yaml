- id: 2021-cvpr-timestamp-supervision
  title: Temporal Action Segmentation From Timestamp Supervision
  authors:
  - Zhe Li
  - Yazan Abu Farha
  - Jurgen Gall
  year: 2021
  venue: CVPR
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/CVPR2021/html/Li_Temporal_Action_Segmentation_From_Timestamp_Supervision_CVPR_2021_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/CVPR2021/papers/Li_Temporal_Action_Segmentation_From_Timestamp_Supervision_CVPR_2021_paper.pdf
  arxiv_url: https://arxiv.org/abs/2103.06669
  doi: ''
  code_url: ''
  project_url: ''
  abstract: Temporal action segmentation approaches have been very successful recently. However, annotating videos with frame-wise
    labels to train such models is very expensive and time consuming. While weakly supervised methods trained using only ordered
    action lists require less annotation effort, the performance is still worse than fully supervised approaches. In this
    paper, we propose to use timestamp supervision for the temporal action segmentation task. Timestamps require a comparable
    annotation effort to weakly supervised approaches, and yet provide a more supervisory signal. To demonstrate the effectiveness
    of timestamp supervision, we propose an approach to train a segmentation model using only timestamps annotations. Our
    approach uses the model output and the annotated timestamps to generate frame-wise labels by detecting the action changes.
    We further introduce a confidence loss that forces the predicted probabilities to monotonically decrease as the distance
    to the timestamps increases. This ensures that all and not only the most distinctive frames of an action are learned during
    training. The evaluation on four datasets shows that models trained with timestamps annotations achieve comparable performance
    to the fully supervised approaches.
