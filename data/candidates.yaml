  - Angela Yao
  year: 2022
  venue: ECCV
  venue_tier: Top-Vision
  publication_type: conference
  official_publication_url: https://www.ecva.net/papers/eccv_2022/papers_ECCV/html/4788_ECCV_2022_paper.php
  official_pdf_url: https://www.ecva.net/papers/eccv_2022/papers_ECCV/papers/136640276.pdf
  arxiv_url: https://arxiv.org/abs/2207.10137
  doi: ''
  code_url: https://github.com/rahulrahaman/Timestamp-and-SkipTag
  project_url: ''
  abstract: In temporal action segmentation, Timestamp supervision requires only a handful of labelled frames per video sequence.
    For unlabelled frames, previous works rely on assigning hard labels, and performance rapidly collapses under subtle violations
    of the annotation assumptions. We propose a novel Expectation-Maximization (EM) based approach that leverages the label
    uncertainty of unlabelled frames and is robust enough to accommodate possible annotation errors. With accurate timestamp
    annotations, our proposed method produces SOTA results and even exceeds the fully-supervised setup in several metrics
    and datasets. When applied to timestamp annotations with missing action segments, our method presents stable performance.
    To further test our formulation's robustness, we introduce the new challenging annotation setup of Skip-tag supervision.
    This setup relaxes constraints and requires annotations of any fixed number of random frames in a video, making it more
    flexible than Timestamp supervision while remaining competitive.
