[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome-action-segmentation"
version = "0.1.0"
description = "Verified metadata and reproducible documentation for temporal action segmentation research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "beautifulsoup4>=4.12",
  "jsonschema>=4.22",
  "pypdf>=4.2",
  "PyYAML>=6.0",
  "requests>=2.32",
]

[project.optional-dependencies]
test = ["pytest>=8.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

