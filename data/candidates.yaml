- id: 2025-iccv-duoclr-dual-surrogate-contrastive-learning
  title: 'DuoCLR: Dual-Surrogate Contrastive Learning for Skeleton-based Human Action Segmentation'
  authors:
  - Haitao Tian
  year: 2025
  venue: ICCV
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/ICCV2025/html/Tian_DuoCLR_Dual-Surrogate_Contrastive_Learning_for_Skeleton-based_Human_Action_Segmentation_ICCV_2025_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/ICCV2025/papers/Tian_DuoCLR_Dual-Surrogate_Contrastive_Learning_for_Skeleton-based_Human_Action_Segmentation_ICCV_2025_paper.pdf
  arxiv_url: http://arxiv.org/abs/2509.05543
  doi: ''
  code_url: ''
  project_url: ''
  abstract: 'In this paper, a contrastive representation learning framework is proposed to enhance human action segmentation
    via pre-training using trimmed (single action) skeleton sequences. Unlike previous representation learning works that
    are tailored for action recognition and that build upon isolated sequence-wise representations, the proposed framework
    focuses on exploiting multi-scale representations in conjunction with cross-sequence variations. More specifically, it
    proposes a novel data augmentation strategy, "Shuffle and Warp", which exploits diverse multi-action permutations. The
    latter effectively assists two surrogate tasks that are introduced in contrastive learning: Cross Permutation Contrasting
    (CPC) and Relative Order Reasoning (ROR). In optimization, CPC learns intra-class similarities by contrasting representations
    of the same action class across different permutations, while ROR reasons about inter-class contexts by predicting relative
    mapping between two permutations. Together, these tasks enable a Dual-Surrogate Contrastive Learning (DuoCLR) network
    to learn multi-scale feature representations optimized for action segmentation. In experiments, DuoCLR is pre-trained
    on a trimmed skeleton dataset and evaluated on an untrimmed dataset where it demonstrates a significant boost over state-the-art
    comparatives in both multi-class and multi-label action segmentation tasks. Lastly, ablation studies are conducted to
    evaluate the effectiveness of each component of the proposed approach.'
