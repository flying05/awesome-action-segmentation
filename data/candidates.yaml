- id: 2023-preprint-end-end-streaming-reinforce-learning
  title: End-to-End Streaming Video Temporal Action Segmentation with Reinforce Learning
  authors:
  - Jinrong Zhang
  - Wujun Wen
  - Shenglan Liu
  - Yunheng Li
  - Qifeng Li
  - Lin Feng
  year: 2023
  venue: Preprint
  venue_tier: Preprint
