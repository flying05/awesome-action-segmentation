- id: 2024-bmvc-cost-sensitive-learning-long-tailed
  title: Cost-Sensitive Learning for Long-Tailed Temporal Action Segmentation
  authors:
  - Zhanzhong Pang
  - Fadime Sener
  - Shrinivas Ramasubramanian
  - Angela Yao
  year: 2024
  venue: BMVC
  venue_tier: Top-Vision
  publication_type: conference
  official_publication_url: https://bmvc2024.org/proceedings/227/
  official_pdf_url: https://bmva-archive.org.uk/bmvc/2024/papers/Paper_227/paper.pdf
  arxiv_url: https://arxiv.org/abs/2503.18358
  doi: ''
  code_url: ''
  project_url: ''
  abstract: Temporal action segmentation in untrimmed procedural videos aims to densely label frames into action classes.
    These videos inherently exhibit long-tailed distributions, where actions vary widely in frequency and duration. In temporal
    action segmentation approaches, we identified a bi-level learning bias. This bias encompasses (1) a class-level bias,
    stemming from class imbalance favoring head classes, and (2) a transition-level bias arising from variations in transitions,
    prioritizing commonly observed transitions. As a remedy, we introduce a constrained optimization problem to alleviate
    both biases. We define learning states for action classes and their associated transitions and integrate them into the
    optimization process. We propose a novel cost-sensitive loss function formulated as a weighted cross-entropy loss, with
    weights adaptively adjusted based on the learning state of actions and their transitions. Experiments on three challenging
    temporal segmentation benchmarks and various frameworks demonstrate the effectiveness of our approach, resulting in significant
    improvements in both per-class frame-wise and segment-wise performance.
