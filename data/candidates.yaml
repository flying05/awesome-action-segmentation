- id: 2022-preprint-skeleton-based-multi-stage-spatial
  title: Skeleton-Based Action Segmentation with Multi-Stage Spatial-Temporal Graph Convolutional Neural Networks
  authors:
  - Benjamin Filtjens
  - Bart Vanrumste
  - Peter Slaets
  year: 2022
  venue: Preprint
