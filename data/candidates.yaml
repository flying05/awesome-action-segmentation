- id: 2023-iccv-weakly-supervised-unseen-error-detection
  title: Weakly-Supervised Action Segmentation and Unseen Error Detection in Anomalous Instructional Videos
  authors:
  - Reza Ghoddoosian
  - Isht Dwivedi
  - Nakul Agarwal
  - Behzad Dariush
  year: 2023
  venue: ICCV
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/ICCV2023/html/Ghoddoosian_Weakly-Supervised_Action_Segmentation_and_Unseen_Error_Detection_in_Anomalous_Instructional_ICCV_2023_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/ICCV2023/papers/Ghoddoosian_Weakly-Supervised_Action_Segmentation_and_Unseen_Error_Detection_in_Anomalous_Instructional_ICCV_2023_paper.pdf
  arxiv_url: ''
  doi: ''
  code_url: ''
  project_url: ''
  abstract: We present a novel method for weakly-supervised action segmentation and unseen error detection in anomalous instructional
    videos. In the absence of an appropriate dataset for this task, we introduce the Anomalous Toy Assembly (ATA) dataset,
    which comprises 1152 untrimmed videos of 32 participants assembling three different toys, recorded from four different
    viewpoints. The training set comprises 27 participants who assemble toys in an expected and consistent manner, while the
    test and validation sets comprise 5 participants who display sequential anomalies in their task. We introduce a weakly
    labeled segmentation algorithm that is a generalization of the constrained Viterbi algorithm and identifies potential
    anomalous moments based on the difference between future anticipation and current recognition results. The proposed method
    is not restricted by the training transcripts during testing, allowing for the inference of anomalous action sequences
    while maintaining real-time performance. Based on these segmentation results, we also introduce a baseline to detect pre-defined
    human errors, and benchmark results on the ATA dataset. Experiments were conducted on the ATA and CSV datasets, demonstrating
    that the proposed method outperforms the state-of-the-art in segmenting anomalous videos under both online and offline
    conditions.
