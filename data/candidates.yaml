  doi: ''
  code_url: ''
  project_url: ''
  abstract: Understanding human behavior is an important problem in the pursuit of visual intelligence. A challenge in this
    endeavor is the extensive and costly effort required to accurately label action segments. To address this issue, we consider
    learning methods that demand minimal supervision for segmentation of human actions in long instructional videos. Specifically,
    we introduce a weakly-supervised framework that uniquely incorporates pose knowledge during training while omitting its
    use during inference, thereby distilling pose knowledge pertinent to each action component. We propose a pose-inspired
    contrastive loss as a part of the whole weakly-supervised framework which is trained to distinguish action boundaries
    more effectively. Our approach, validated through extensive experiments on representative datasets, outperforms previous
    state-of-the-art (SOTA) in segmenting long instructional videos under both online and offline settings. Additionally,
    we demonstrate the framework's adaptability to various segmentation backbones and pose extractors across different datasets.
