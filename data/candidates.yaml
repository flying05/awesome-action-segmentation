- id: 2026-cvpr-polyphony-diffusion-based-dual-hand
  title: 'Polyphony: Diffusion-based Dual-Hand Action Segmentation with Alternating Vision Transformer and Semantic Conditioning'
  authors:
  - Hao Zheng
  - Hu Wang
  - Tiantian Zheng
  - Prajjwal Bhattarai
  - Tuka Alhanai
  year: 2026
  venue: CVPR
  venue_tier: CCF-A
