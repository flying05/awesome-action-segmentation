- id: 2025-preprint-vifss-view-invariant-figure-skating
  title: 'VIFSS: View-Invariant and Figure Skating-Specific Pose Representation Learning for Temporal Action Segmentation'
  authors:
  - Ryota Tanaka
  - Tomohiro Suzuki
  - Keisuke Fujii
  year: 2025
  venue: Preprint
  venue_tier: Preprint
  publication_type: preprint
