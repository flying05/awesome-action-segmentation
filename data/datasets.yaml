  common_metrics: [MoF, Edit, F1@10, F1@25, F1@50]
  representative_papers: [2013-icmr-50salads, 2019-cvpr-ms-tcn]
  notes: "The widely used mid-level protocol has 17 action classes; counts differ for coarse/fine granularity."
- name: GTEA
  domain: egocentric kitchen activities
  modality: RGB
  number_of_videos: 28
  number_of_actions: 11
  average_video_length: "about 1 minute"
  view: egocentric
  annotation_type: frame-level actions
  official_url: https://cbs.ic.gatech.edu/fpv/
  commonly_used_splits: four-fold cross-validation
  common_metrics: [MoF, Edit, F1@10, F1@25, F1@50]
