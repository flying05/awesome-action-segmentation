- id: 2022-icme-turning-teacher-timestamp-supervised
  title: Turning to a Teacher for Timestamp Supervised Temporal Action Segmentation
  authors:
  - Yang Zhao
  - Yan Song
  year: 2022
  venue: ICME
  venue_tier: Extended-Vision
  publication_type: conference
  official_publication_url: https://doi.org/10.1109/ICME52920.2022.9859626
  official_pdf_url: https://arxiv.org/pdf/2207.00712
  arxiv_url: https://arxiv.org/abs/2207.00712
  doi: 10.1109/ICME52920.2022.9859626
  code_url: ''
  project_url: ''
  abstract: Temporal action segmentation in videos has drawn much attention recently. Timestamp supervision is a cost-effective
    way for this task. To obtain more information to optimize the model, the existing method generated pseudo frame-wise labels
    iteratively based on the output of a segmentation model and the timestamp annotations. However, this practice may introduce
    noise and oscillation during the training, and lead to performance degeneration. To address this problem, we propose a
    new framework for timestamp supervised temporal action segmentation by introducing a teacher model parallel to the segmentation
    model to help stabilize the process of model optimization. The teacher model can be seen as an ensemble of the segmentation
    model, which helps to suppress the noise and to improve the stability of pseudo labels. We further introduce a segmentally
    smoothing loss, which is more focused and cohesive, to enforce the smooth transition of the predicted probabilities within
    action instances. The experiments on three datasets show that our method outperforms the state-of-the-art method and performs
    comparably against the fully-supervised methods at a much lower annotation cost.
