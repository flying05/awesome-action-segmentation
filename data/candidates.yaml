- id: 2023-preprint-bit-bi-level-modeling-efficient
  title: 'BIT: Bi-Level Temporal Modeling for Efficient Supervised Action Segmentation'
  authors:
  - Zijia Lu
  - Ehsan Elhamifar
  year: 2023
  venue: Preprint
  venue_tier: Preprint
  publication_type: preprint
  official_publication_url: ''
