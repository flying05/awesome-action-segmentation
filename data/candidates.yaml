- id: 2020-cvpr-intra-inter-understanding-parsing
  title: Intra- and Inter-Action Understanding via Temporal Action Parsing
  authors:
  - Dian Shao
  - Yue Zhao
  - Bo Dai
  - Dahua Lin
  year: 2020
  venue: CVPR
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content_CVPR_2020/html/Shao_Intra-_and_Inter-Action_Understanding_via_Temporal_Action_Parsing_CVPR_2020_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content_CVPR_2020/papers/Shao_Intra-_and_Inter-Action_Understanding_via_Temporal_Action_Parsing_CVPR_2020_paper.pdf
  arxiv_url: https://arxiv.org/abs/2005.10229
  doi: ''
  code_url: ''
  project_url: ''
  abstract: Current methods for action recognition primarily rely on deep convolutional networks to derive feature embeddings
    of visual and motion features. While these methods have demonstrated remarkable performance on standard benchmarks, we
    are still in need of a better understanding as to how the videos, in particular their internal structures, relate to high-level
    semantics, which may lead to benefits in multiple aspects, e.g. interpretable predictions and even new methods that can
    take the recognition performances to a next level. Towards this goal, we construct TAPOS, a new dataset developed on sport
    videos with manual annotations of sub-actions, and conduct a study on temporal action parsing on top. Our study shows
    that a sport activity usually consists of multiple sub-actions and that the awareness of such temporal structures is beneficial
    to action recognition. We also investigate a number of temporal parsing methods, and thereon devise an improved method
    that is capable of mining sub-actions from training data without knowing the labels of them. On the constructed TAPOS,
    the proposed method is shown to reveal intra-action information, i.e. how action instances are made of sub-actions, and
    inter-action information, i.e. one specific sub-action may commonly appear in various actions.
