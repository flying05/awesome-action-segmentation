- id: 2024-preprint-2by2-weakly-supervised-learning-global
  title: '2by2: Weakly-Supervised Learning for Global Action Segmentation'
  authors:
  - Elena Bueno-Benito
  - Mariella Dimiccoli
  year: 2024
  venue: Preprint
  venue_tier: Preprint
  publication_type: preprint
