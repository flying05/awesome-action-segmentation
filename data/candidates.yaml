- id: 2019-cvpr-d3tw-discriminative-differentiable-dynamic-time
  title: 'D3TW: Discriminative Differentiable Dynamic Time Warping for Weakly Supervised Action Alignment and Segmentation'
  authors:
  - Chien-Yi Chang
  - De-An Huang
  - Yanan Sui
  - Li Fei-Fei
  - Juan Carlos Niebles
  year: 2019
  venue: CVPR
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content_CVPR_2019/html/Chang_D3TW_Discriminative_Differentiable_Dynamic_Time_Warping_for_Weakly_Supervised_Action_CVPR_2019_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content_CVPR_2019/papers/Chang_D3TW_Discriminative_Differentiable_Dynamic_Time_Warping_for_Weakly_Supervised_Action_CVPR_2019_paper.pdf
  arxiv_url: ''
  doi: ''
  code_url: ''
  project_url: ''
  abstract: We address weakly supervised action alignment and segmentation in videos, where only the order of occurring actions
    is available during training. We propose Discriminative Differentiable Dynamic Time Warping (D3TW), the first discriminative
    model using weak ordering supervision. The key technical challenge for discriminative modeling with weak supervision is
    that the loss function of the ordering supervision is usually formulated using dynamic programming and is thus not differentiable.
    We address this challenge with a continuous relaxation of the min-operator in dynamic programming and extend the alignment
    loss to be differentiable. The proposed D3TW innovatively solves sequence alignment with discriminative modeling and end-to-end
    training, which substantially improves the performance in weakly supervised action alignment and segmentation tasks. We
    show that our model is able to bypass the degenerated sequence problem usually encountered in previous work and outperform
    the current state-of-the-art across three evaluation metrics in two challenging datasets.
