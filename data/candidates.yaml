- id: 2021-iccv-weakly-supervised-alignment-transcript-aware
  title: Weakly-Supervised Action Segmentation and Alignment via Transcript-Aware Union-of-Subspaces Learning
  authors:
  - Zijia Lu
  - Ehsan Elhamifar
  year: 2021
  venue: ICCV
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/ICCV2021/html/Lu_Weakly-Supervised_Action_Segmentation_and_Alignment_via_Transcript-Aware_Union-of-Subspaces_Learning_ICCV_2021_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/ICCV2021/papers/Lu_Weakly-Supervised_Action_Segmentation_and_Alignment_via_Transcript-Aware_Union-of-Subspaces_Learning_ICCV_2021_paper.pdf
  arxiv_url: ''
  doi: ''
  code_url: ''
  project_url: ''
  abstract: We address the problem of learning to segment actions from weakly-annotated videos, i.e., videos accompanied by
    transcripts (ordered list of actions). We propose a framework in which we model actions with a union of low-dimensional
    subspaces, learn the subspaces using transcripts and refine video features that lend themselves to action subspaces. To
    do so, we design an architecture consisting of a Union-of-Subspace Network, which is an ensemble of autoencoders, each
    modeling a low-dimensional action subspace and can capture variations of an action within and across videos. For learning,
    at each iteration, we generate positive and negative soft alignment matrices using the segmentations from the previous
    iteration, which we use for discriminative training of our model. To regularize the learning, we introduce a constraint
    loss that prevents imbalanced segmentations and enforces relatively similar duration of each action across videos. To
    have a real-time inference, we develop a hierarchical segmentation framework that uses subset selection to find representative
    transcripts and hierarchically align a test video with increasingly refined representative transcripts. Our experiments
    on three datasets show that our method improves the state-of-the-art action segmentation and alignment, while speeding
    up the inference time by a factor of 4 to 13.
