- id: 2019-iccv-weakly-supervised-energy-based-learning
  title: Weakly Supervised Energy-Based Learning for Action Segmentation
  authors:
  - Jun Li
  - Peng Lei
  - Sinisa Todorovic
  year: 2019
  venue: ICCV
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content_ICCV_2019/html/Li_Weakly_Supervised_Energy-Based_Learning_for_Action_Segmentation_ICCV_2019_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content_ICCV_2019/papers/Li_Weakly_Supervised_Energy-Based_Learning_for_Action_Segmentation_ICCV_2019_paper.pdf
  arxiv_url: https://arxiv.org/abs/1909.13155
  doi: ''
  code_url: ''
  project_url: ''
  abstract: This paper is about labeling video frames with action classes under weak supervision in training, where we have
    access to a temporal ordering of actions, but their start and end frames in training videos are unknown. Following prior
    work, we use an HMM grounded on a Gated Recurrent Unit (GRU) for frame labeling. Our key contribution is a new constrained
    discriminative forward loss (CDFL) that we use for training the HMM and GRU under weak supervision. While prior work typically
    estimates the loss on a single, inferred video segmentation, our CDFL discriminates between the energy of all valid and
    invalid frame labelings of a training video. A valid frame labeling satisfies the ground-truth temporal ordering of actions,
    whereas an invalid one violates the ground truth. We specify an efficient recursive algorithm for computing the CDFL in
    terms of the logadd function of the segmentation energy. Our evaluation on action segmentation and alignment gives superior
    results to those of the state of the art on the benchmark Breakfast Action, Hollywood Extended, and 50Salads datasets.
