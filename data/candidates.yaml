- id: 2026-preprint-unsupervised-skeleton-based-hierarchical-spatiotemporal
  title: Unsupervised Skeleton-Based Action Segmentation via Hierarchical Spatiotemporal Vector Quantization
  authors:
  - Umer Ahmed
  - Syed Ahmed Mahmood
  - Fawad Javed Fateh
  - M. Shaheer Luqman
  - M. Zeeshan Zia
  - Quoc-Huy Tran
  year: 2026
