- id: 2024-cvpr-coherent-synthesis-incremental
  title: Coherent Temporal Synthesis for Incremental Action Segmentation
  authors:
  - Guodong Ding
  - Hans Golong
  - Angela Yao
  year: 2024
  venue: CVPR
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/CVPR2024/html/Ding_Coherent_Temporal_Synthesis_for_Incremental_Action_Segmentation_CVPR_2024_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/CVPR2024/papers/Ding_Coherent_Temporal_Synthesis_for_Incremental_Action_Segmentation_CVPR_2024_paper.pdf
  arxiv_url: http://arxiv.org/abs/2403.06102
  doi: ''
  code_url: ''
  project_url: ''
  abstract: Data replay is a successful incremental learning technique for images. It prevents catastrophic forgetting by
    keeping a reservoir of previous data original or synthesized to ensure the model retains past knowledge while adapting
    to novel concepts. However its application in the video domain is rudimentary as it simply stores frame exemplars for
    action recognition. This paper presents the first exploration of video data replay techniques for incremental action segmentation
    focusing on action temporal modeling. We propose a Temporally Coherent Action (TCA) model which represents actions using
    a generative model instead of storing individual frames. The integration of a conditioning variable that captures temporal
    coherence allows our model to understand the evolution of action features over time. Therefore action segments generated
    by TCA for replay are diverse and temporally coherent. In a 10-task incremental setup on the Breakfast dataset our approach
    achieves significant increases in accuracy for up to 22% compared to the baselines.
