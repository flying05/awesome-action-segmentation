- id: 2026-cvpr-lady-lagrangian-dynamic-informed-network
  title: 'LaDy: Lagrangian-Dynamic Informed Network for Skeleton-based Action Segmentation via Spatial-Temporal Modulation'
  authors:
  - Haoyu Ji
  - Xueting Liu
  - Yu Gao
  - Wenze Huang
  - Zhihao Yang
  - Weihong Ren
  - Zhiyong Wang
  - Honghai Liu
  year: 2026
  venue: CVPR
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/CVPR2026/html/Ji_LaDy_Lagrangian-Dynamic_Informed_Network_for_Skeleton-based_Action_Segmentation_via_Spatial-Temporal_CVPR_2026_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/CVPR2026/papers/Ji_LaDy_Lagrangian-Dynamic_Informed_Network_for_Skeleton-based_Action_Segmentation_via_Spatial-Temporal_CVPR_2026_paper.pdf
  arxiv_url: https://arxiv.org/abs/2603.24097
  doi: ''
  code_url: ''
  project_url: ''
  abstract: 'Skeleton-based Temporal Action Segmentation (STAS) aims to densely parse untrimmed skeletal sequences into frame-level
    action categories. However, existing methods, while proficient at capturing spatio-temporal kinematics, neglect the underlying
    physical dynamics that govern human motion. This oversight limits inter-class discriminability between actions with similar
    kinematics but distinct dynamic intents, and hinders precise boundary localization where dynamic force profiles shift.
    To address these, we propose the Lagrangian-Dynamic Informed Network (LaDy), a framework integrating principles of Lagrangian
    dynamics into the segmentation process. Specifically, LaDy first computes generalized coordinates from joint positions
    and then estimates Lagrangian terms under physical constraints to explicitly synthesize the generalized forces. To further
    ensure physical coherence, our Energy Consistency Loss enforces the work-energy theorem, aligning kinetic energy change
    with the work done by the net force. The learned dynamics then drive a Spatio-Temporal Modulation module: Spatially, generalized
    forces are fused with spatial representations to provide more discriminative semantics. Temporally, salient dynamic signals
    are constructed for temporal gating, thereby significantly enhancing boundary awareness. Experiments on challenging datasets
    show that LaDy achieves state-of-the-art performance, validating the integration of physical dynamics for action segmentation.
    Code is available at https://github.com/HaoyuJi/LaDy.'
