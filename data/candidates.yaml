- id: 2020-cvpr-sct-set-constrained-transformer-set
  title: 'SCT: Set Constrained Temporal Transformer for Set Supervised Action Segmentation'
  authors:
  - Mohsen Fayyaz
  - Jurgen Gall
  year: 2020
  venue: CVPR
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content_CVPR_2020/html/Fayyaz_SCT_Set_Constrained_Temporal_Transformer_for_Set_Supervised_Action_Segmentation_CVPR_2020_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content_CVPR_2020/papers/Fayyaz_SCT_Set_Constrained_Temporal_Transformer_for_Set_Supervised_Action_Segmentation_CVPR_2020_paper.pdf
  arxiv_url: https://arxiv.org/abs/2003.14266
  doi: ''
  code_url: ''
  project_url: ''
  abstract: Temporal action segmentation is a topic of increasing interest, however, annotating each frame in a video is cumbersome
    and costly. Weakly supervised approaches therefore aim at learning temporal action segmentation from videos that are only
    weakly labeled. In this work, we assume that for each training video only the list of actions is given that occur in the
    video, but not when, how often, and in which order they occur. In order to address this task, we propose an approach that
    can be trained end-to-end on such data. The approach divides the video into smaller temporal regions and predicts for
    each region the action label and its length. In addition, the network estimates the action labels for each frame. By measuring
    how consistent the frame-wise predictions are with respect to the temporal regions and the annotated action labels, the
    network learns to divide a video into class-consistent regions. We evaluate our approach on three datasets where the approach
    achieves state-of-the-art results.
