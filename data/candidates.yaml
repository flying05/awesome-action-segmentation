  abstract: Temporal context plays a significant role in temporal action segmentation. In an offline setting, the context
    is typically captured by the segmentation network after observing the entire sequence. However, capturing and using such
    context information in an online setting remains an under-explored problem. This work presents the an online framework
    for temporal action segmentation. At the core of the framework is an adaptive memory designed to accommodate dynamic changes
    in context over time, alongside a feature augmentation module that enhances the frames with the memory. In addition, we
    propose a post-processing approach to mitigate the severe over-segmentation in the online setting. On three common segmentation
    benchmarks, our approach achieves state-of-the-art performance.
