- id: 2022-cvpr-assembly101-large-scale-multi-view
  title: 'Assembly101: A Large-Scale Multi-View Video Dataset for Understanding Procedural Activities'
  authors:
  - Fadime Sener
  - Dibyadip Chatterjee
  - Daniel Shelepov
  - Kun He
  - Dipika Singhania
  - Robert Wang
  - Angela Yao
