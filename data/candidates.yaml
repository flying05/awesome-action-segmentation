- id: 2023-iccv-how-much-long-term-context
  title: How Much Temporal Long-Term Context is Needed for Action Segmentation?
  authors:
  - Emad Bahrami
  - Gianpiero Francesca
  - Juergen Gall
  year: 2023
  venue: ICCV
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/ICCV2023/html/Bahrami_How_Much_Temporal_Long-Term_Context_is_Needed_for_Action_Segmentation_ICCV_2023_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/ICCV2023/papers/Bahrami_How_Much_Temporal_Long-Term_Context_is_Needed_for_Action_Segmentation_ICCV_2023_paper.pdf
  arxiv_url: https://arxiv.org/abs/2308.11358
  doi: ''
  code_url: ''
  project_url: ''
  abstract: Modeling long-term context in videos is crucial for many fine-grained tasks including temporal action segmentation.
    An interesting question that is still open is how much long-term temporal context is needed for optimal performance. While
    transformers can model the long-term context of a video, this becomes computationally prohibitive for long videos. Recent
    works on temporal action segmentation thus combine temporal convolutional networks with self-attentions that are computed
    only for a local temporal window. While these approaches show good results, their performance is limited by their inability
    to capture the full context of a video. In this work, we try to answer how much long-term temporal context is required
    for temporal action segmentation by introducing a transformer-based model that leverages sparse attention to capture the
    full context of a video. We compare our model with the current state of the art on three datasets for temporal action
    segmentation, namely 50Salads, Breakfast, and Assembly101. Our experiments show that modeling the full context of a video
    is necessary to obtain the best performance for temporal action segmentation.
