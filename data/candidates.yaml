- id: 2019-preprint-hybrid-rnn-hmm-approach-weakly
  title: A Hybrid RNN-HMM Approach for Weakly Supervised Temporal Action Segmentation
  authors:
  - Hilde Kuehne
  - Alexander Richard
  - Juergen Gall
  year: 2019
  venue: Preprint
  venue_tier: Preprint
  publication_type: preprint
