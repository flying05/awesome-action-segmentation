- id: 2024-cvpr-efficient-effective-weakly-supervised-transition
  title: Efficient and Effective Weakly-Supervised Action Segmentation via Action-Transition-Aware Boundary Alignment
  authors:
  - Angchi Xu
  - Wei-Shi Zheng
  year: 2024
  venue: CVPR
  venue_tier: CCF-A
  publication_type: conference
  official_publication_url: https://openaccess.thecvf.com/content/CVPR2024/html/Xu_Efficient_and_Effective_Weakly-Supervised_Action_Segmentation_via_Action-Transition-Aware_Boundary_Alignment_CVPR_2024_paper.html
  official_pdf_url: https://openaccess.thecvf.com/content/CVPR2024/papers/Xu_Efficient_and_Effective_Weakly-Supervised_Action_Segmentation_via_Action-Transition-Aware_Boundary_Alignment_CVPR_2024_paper.pdf
  arxiv_url: http://arxiv.org/abs/2403.19225
  doi: ''
  code_url: ''
  project_url: ''
  abstract: Weakly-supervised action segmentation is a task of learning to partition a long video into several action segments
    where training videos are only accompanied by transcripts (ordered list of actions). Most of existing methods need to
    infer pseudo segmentation for training by serial alignment between all frames and the transcript which is time-consuming
    and hard to be parallelized while training. In this work we aim to escape from this inefficient alignment with massive
    but redundant frames and instead to directly localize a few action transitions for pseudo segmentation generation where
    a transition refers to the change from an action segment to its next adjacent one in the transcript. As the true transitions
    are submerged in noisy boundaries due to intra-segment visual variation we propose a novel Action-Transition-Aware Boundary
    Alignment (ATBA) framework to efficiently and effectively filter out noisy boundaries and detect transitions. In addition
    to boost the semantic learning in the case that noise is inevitably present in the pseudo segmentation we also introduce
    video-level losses to utilize the trusted video-level supervision. Extensive experiments show the effectiveness of our
    approach on both performance and training speed.
